    Projects:
      - name: Theory Today
        summary: ‘Theory Today’ working group aims primarily to read and discuss the diverse range of trends within contemporary theory. From Psychoanalysis to contemporary interventions within Marxism, Postcolonial thought, Media Theory, and Gender and Sexuality studies, this group engages with recently published monographs and essays from various fields and backgrounds that are actively shaping contemporary theoretical discourse.
        start_date: 2024
